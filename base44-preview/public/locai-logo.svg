<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <defs>
    <!-- Pin body gradient: bright emerald top → deep forest base -->
    <linearGradient id="pinBody" x1="50" y1="5" x2="50" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="38%"  stop-color="#10b981"/>
      <stop offset="80%"  stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Left-face specular highlight -->
    <linearGradient id="pinFace" x1="14" y1="12" x2="60" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Inner panel dark background -->
    <radialGradient id="innerBg" cx="44%" cy="38%" r="58%">
      <stop offset="0%"   stop-color="#042d1b"/>
      <stop offset="100%" stop-color="#021610"/>
    </radialGradient>
    <!-- Core glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient inner glow on pin body -->
    <radialGradient id="bodyGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="drop" x="-28%" y="-12%" width="156%" height="158%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#042d1b" flood-opacity="0.65"/>
    </filter>
    <!-- Inner panel inset shadow -->
    <filter id="inset" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#010e09" flood-opacity="0.9"/>
    </filter>
    <!-- Clip to pin silhouette (used for specular layer) -->
    <clipPath id="pinClip">
      <path d="M50 7 C29 7 13 23 13 44 C13 67 50 113 50 113 C50 113 87 67 87 44 C87 23 71 7 50 7 Z"/>
    </clipPath>
  </defs>

  <!-- ── Ground shadow ── -->
  <ellipse cx="50" cy="117" rx="19" ry="4" fill="#064e3b" opacity="0.3"/>

  <!-- ── Pin body ── -->
  <path d="M50 7 C29 7 13 23 13 44 C13 67 50 113 50 113 C50 113 87 67 87 44 C87 23 71 7 50 7 Z"
        fill="url(#pinBody)" filter="url(#drop)"/>

  <!-- ── Ambient inner glow (overlaid on body) ── -->
  <path d="M50 7 C29 7 13 23 13 44 C13 67 50 113 50 113 C50 113 87 67 87 44 C87 23 71 7 50 7 Z"
        fill="url(#bodyGlow)" clip-path="url(#pinClip)"/>

  <!-- ── Left specular rim highlight ── -->
  <path d="M50 8 C31 8 14 24 13 44 C13 63 32 93 50 112"
        stroke="white" stroke-width="2.2" stroke-opacity="0.2" fill="none" stroke-linecap="round"/>

  <!-- ── Right edge subtle shadow ── -->
  <path d="M87 44 C87 63 68 93 50 112"
        stroke="#021610" stroke-width="3" stroke-opacity="0.18" fill="none" stroke-linecap="round"/>

  <!-- ── Gloss highlight (upper-left bulge) ── -->
  <ellipse cx="37" cy="26" rx="13" ry="8" fill="white" opacity="0.13"
           transform="rotate(-22 37 26)" clip-path="url(#pinClip)"/>

  <!-- ── Inner panel (dark circle) ── -->
  <circle cx="50" cy="44" r="27" fill="url(#innerBg)" filter="url(#inset)"/>
  <!-- Inner panel border ring -->
  <circle cx="50" cy="44" r="27" stroke="rgba(52,211,153,0.3)" stroke-width="0.8" fill="none"/>
  <!-- Outer dashed circuit ring -->
  <circle cx="50" cy="44" r="22" stroke="rgba(52,211,153,0.18)" stroke-width="0.7"
          fill="none" stroke-dasharray="3.2 2.4"/>

  <!-- ── Cardinal circuit traces ── -->
  <line x1="28" y1="44" x2="35" y2="44" stroke="#34d399" stroke-width="1"   opacity="0.72"/>
  <line x1="65" y1="44" x2="72" y2="44" stroke="#34d399" stroke-width="1"   opacity="0.72"/>
  <line x1="50" y1="22" x2="50" y2="29" stroke="#34d399" stroke-width="1"   opacity="0.72"/>
  <line x1="50" y1="59" x2="50" y2="66" stroke="#34d399" stroke-width="1"   opacity="0.72"/>

  <!-- ── Diagonal traces ── -->
  <line x1="34.7" y1="29.7" x2="39.2" y2="34.2" stroke="#34d399" stroke-width="0.75" opacity="0.48"/>
  <line x1="65.3" y1="29.7" x2="60.8" y2="34.2" stroke="#34d399" stroke-width="0.75" opacity="0.48"/>
  <line x1="34.7" y1="58.3" x2="39.2" y2="53.8" stroke="#34d399" stroke-width="0.75" opacity="0.48"/>
  <line x1="65.3" y1="58.3" x2="60.8" y2="53.8" stroke="#34d399" stroke-width="0.75" opacity="0.48"/>

  <!-- ── Cardinal endpoint nodes ── -->
  <circle cx="28" cy="44" r="2.1" fill="#34d399" opacity="0.88"/>
  <circle cx="72" cy="44" r="2.1" fill="#34d399" opacity="0.88"/>
  <circle cx="50" cy="22" r="2.1" fill="#34d399" opacity="0.88"/>
  <circle cx="50" cy="66" r="2.1" fill="#34d399" opacity="0.88"/>

  <!-- ── Diagonal endpoint nodes ── -->
  <circle cx="34.7" cy="29.7" r="1.4" fill="#34d399" opacity="0.52"/>
  <circle cx="65.3" cy="29.7" r="1.4" fill="#34d399" opacity="0.52"/>
  <circle cx="34.7" cy="58.3" r="1.4" fill="#34d399" opacity="0.52"/>
  <circle cx="65.3" cy="58.3" r="1.4" fill="#34d399" opacity="0.52"/>

  <!-- ── Mid circuit ring ── -->
  <circle cx="50" cy="44" r="13" stroke="#10b981" stroke-width="1.1" fill="none" opacity="0.55"/>

  <!-- ── Spoke connectors (circuit ring → centre) ── -->
  <line x1="37.3" y1="44" x2="40"   y2="44" stroke="#10b981" stroke-width="1.3" opacity="0.75"/>
  <line x1="60"   y1="44" x2="62.7" y2="44" stroke="#10b981" stroke-width="1.3" opacity="0.75"/>
  <line x1="50"   y1="31.3" x2="50" y2="34"  stroke="#10b981" stroke-width="1.3" opacity="0.75"/>
  <line x1="50"   y1="54"   x2="50" y2="56.7" stroke="#10b981" stroke-width="1.3" opacity="0.75"/>

  <!-- ── Core ambient glow ── -->
  <circle cx="50" cy="44" r="10" fill="url(#coreGlow)"/>

  <!-- ── Core circle layers ── -->
  <circle cx="50" cy="44" r="7"   fill="#059669"/>
  <circle cx="50" cy="44" r="4.8" fill="#10b981"/>
  <circle cx="50" cy="44" r="2.8" fill="#34d399"/>
  <!-- Centre bright spark -->
  <circle cx="50" cy="44" r="1.2" fill="white" opacity="0.92"/>

  <!-- ── Inner panel top-edge specular ── -->
  <path d="M31 32 A19 19 0 0 1 69 32"
        stroke="white" stroke-width="1" stroke-opacity="0.1" fill="none"/>

  <!-- ── Pin tip inner highlight ── -->
  <ellipse cx="50" cy="109" rx="2.2" ry="3" fill="white" opacity="0.18"/>
</svg>
