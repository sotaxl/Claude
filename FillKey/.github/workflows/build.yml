name: FillKey iOS Build

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Node (for TypeScript bundling)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Bundle TypeScript extension scripts
        run: |
          cd FillKeySafari/Resources
          esbuild content.ts --bundle --outfile=content.js --platform=browser --target=safari17
          esbuild background.ts --bundle --outfile=background.js --platform=browser --target=safari17
          mkdir -p popup
          esbuild popup/popup.ts --bundle --outfile=popup/popup.js --platform=browser --target=safari17

      - name: Generate Xcode project
        run: |
          cd FillKey
          xcodegen generate

      - name: Resolve dependencies
        run: |
          cd FillKey
          xcodebuild -resolvePackageDependencies \
            -project FillKey.xcodeproj \
            -scheme FillKey

      - name: Build (Debug, no signing)
        run: |
          cd FillKey
          xcodebuild build \
            -project FillKey.xcodeproj \
            -scheme FillKey \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: Run unit tests
        run: |
          cd FillKey
          xcodebuild test \
            -project FillKey.xcodeproj \
            -scheme FillKeyTests \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  archive:
    name: Archive for App Store
    runs-on: macos-15
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle TypeScript
        run: |
          npm install -g esbuild
          cd FillKeySafari/Resources
          esbuild content.ts --bundle --outfile=content.js --platform=browser --target=safari17
          esbuild background.ts --bundle --outfile=background.js --platform=browser --target=safari17
          mkdir -p popup
          esbuild popup/popup.ts --bundle --outfile=popup/popup.js --platform=browser --target=safari17

      - name: Generate Xcode project
        run: |
          cd FillKey
          xcodegen generate

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Import provisioning profiles
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYBOARD_PROFILE_BASE64: ${{ secrets.KEYBOARD_PROFILE_BASE64 }}
          SAFARI_PROFILE_BASE64: ${{ secrets.SAFARI_PROFILE_BASE64 }}
          CREDENTIAL_PROFILE_BASE64: ${{ secrets.CREDENTIAL_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/app.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          echo -n "$KEYBOARD_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/keyboard.mobileprovision
          cp $RUNNER_TEMP/keyboard.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          echo -n "$SAFARI_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/safari.mobileprovision
          cp $RUNNER_TEMP/safari.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          echo -n "$CREDENTIAL_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/credential.mobileprovision
          cp $RUNNER_TEMP/credential.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cd FillKey
          xcodebuild archive \
            -project FillKey.xcodeproj \
            -scheme FillKey \
            -configuration Release \
            -archivePath $RUNNER_TEMP/FillKey.xcarchive \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            | xcbeautify

      - name: Export IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/FillKey.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            | xcbeautify

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/FillKey.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FillKey-IPA
          path: ${{ runner.temp }}/export/FillKey.ipa
          retention-days: 30
