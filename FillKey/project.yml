name: FillKey
options:
  bundleIdPrefix: com.fillkey
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""  # Fill in your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:

  # ─── Container App ───────────────────────────────────────────────────────────
  FillKey:
    type: application
    platform: iOS
    sources:
      - path: FillKey
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fillkey.app
        INFOPLIST_FILE: FillKey/Info.plist
        CODE_SIGN_ENTITLEMENTS: FillKey/FillKey.entitlements
    entitlements:
      path: FillKey/FillKey.entitlements
    dependencies:
      - target: FillKeyKeyboard
      - target: FillKeySafari
      - target: FillKeyCredentialProvider

  # ─── Keyboard Extension ───────────────────────────────────────────────────────
  FillKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: FillKeyKeyboard
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fillkey.app.keyboard
        INFOPLIST_FILE: FillKeyKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: FillKeyKeyboard/FillKeyKeyboard.entitlements

  # ─── Safari Web Extension ────────────────────────────────────────────────────
  FillKeySafari:
    type: app-extension
    platform: iOS
    sources:
      - path: FillKeySafari
        excludes:
          - "**/*.entitlements"
          - Resources/
      - path: FillKeySafari/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fillkey.app.safari
        INFOPLIST_FILE: FillKeySafari/Info.plist
        CODE_SIGN_ENTITLEMENTS: FillKeySafari/FillKeySafari.entitlements

  # ─── AutoFill Credential Provider ────────────────────────────────────────────
  FillKeyCredentialProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: FillKeyCredentialProvider
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fillkey.app.credential-provider
        INFOPLIST_FILE: FillKeyCredentialProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: FillKeyCredentialProvider/FillKeyCredentialProvider.entitlements

  # ─── Unit Tests ───────────────────────────────────────────────────────────────
  FillKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FillKeyTests
    dependencies:
      - target: FillKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fillkey.tests
