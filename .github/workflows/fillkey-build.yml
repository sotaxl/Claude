name: FillKey iOS Build

on:
  push:
    branches: ["claude/*"]
    paths:
      - 'FillKey/**'
      - '.github/workflows/fillkey-build.yml'
  pull_request:
    paths:
      - 'FillKey/**'
      - '.github/workflows/fillkey-build.yml'

defaults:
  run:
    working-directory: FillKey

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app
        working-directory: .

      - name: Install XcodeGen
        run: brew install xcodegen
        working-directory: .

      - name: Install Node (for TypeScript bundling)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install -g esbuild
        working-directory: .

      - name: Bundle TypeScript extension scripts
        run: |
          cd FillKeySafari/Resources
          esbuild content.ts --bundle --outfile=content.js --platform=browser --target=safari17
          esbuild background.ts --bundle --outfile=background.js --platform=browser --target=safari17
          mkdir -p popup
          esbuild popup/popup.ts --bundle --outfile=popup/popup.js --platform=browser --target=safari17

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, simulator, no signing)
        run: |
          xcodebuild build \
            -project FillKey.xcodeproj \
            -scheme FillKey \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project FillKey.xcodeproj \
            -scheme FillKeyTests \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  archive:
    name: Archive & Upload to App Store Connect
    runs-on: macos-15
    needs: build
    # Only run when signing secrets are present (i.e. you've completed SETUP.md)
    if: |
      github.event_name == 'push' &&
      secrets.BUILD_CERTIFICATE_BASE64 != ''
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app
        working-directory: .

      - name: Install XcodeGen
        run: brew install xcodegen
        working-directory: .

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle TypeScript
        run: |
          npm install -g esbuild
          cd FillKeySafari/Resources
          esbuild content.ts --bundle --outfile=content.js --platform=browser --target=safari17
          esbuild background.ts --bundle --outfile=background.js --platform=browser --target=safari17
          mkdir -p popup
          esbuild popup/popup.ts --bundle --outfile=popup/popup.js --platform=browser --target=safari17

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
        working-directory: .

      - name: Import provisioning profiles
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYBOARD_PROFILE_BASE64: ${{ secrets.KEYBOARD_PROFILE_BASE64 }}
          SAFARI_PROFILE_BASE64: ${{ secrets.SAFARI_PROFILE_BASE64 }}
          CREDENTIAL_PROFILE_BASE64: ${{ secrets.CREDENTIAL_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE_BASE64"  | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo -n "$KEYBOARD_PROFILE_BASE64"       | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/keyboard.mobileprovision
          echo -n "$SAFARI_PROFILE_BASE64"         | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/safari.mobileprovision
          echo -n "$CREDENTIAL_PROFILE_BASE64"     | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/credential.mobileprovision
        working-directory: .

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project FillKey.xcodeproj \
            -scheme FillKey \
            -configuration Release \
            -archivePath $RUNNER_TEMP/FillKey.xcarchive \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            | xcbeautify

      - name: Export IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$(DEVELOPMENT_TEAM)</string>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/\$(DEVELOPMENT_TEAM)/$DEVELOPMENT_TEAM/" $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/FillKey.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            | xcbeautify
        working-directory: .

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_BASE64" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/FillKey.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose
        working-directory: .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FillKey-IPA
          path: ${{ runner.temp }}/export/FillKey.ipa
          retention-days: 30
